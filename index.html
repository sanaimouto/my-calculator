<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四葉亭上架工具箱</title>
    <link rel="shortcut icon" href="icon.ico" type="image/x-icon">
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f4f7f6;
            --panel-bg: #ffffff;
            --border-radius: 8px;
        }

        body {
            font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--panel-bg);
            width: 100%;
            max-width: 800px; 
            border-radius: var(--border-radius);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header-bar {
            padding: 10px;
            background: #eef2f5;
            display: flex;
            justify-content: flex-end;
            border-bottom: 1px solid #ddd;
        }
        
        .btn-pop {
            background: #95a5a6;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-pop:hover { background: #7f8c8d; }

        .tabs {
            display: flex;
            background-color: var(--primary-color);
        }

        .tab-btn {
            flex: 1;
            padding: 12px 2px; 
            border: none;
            background: none;
            color: #bdc3c7;
            cursor: pointer;
            font-size: 14px; 
            font-weight: bold;
            transition: 0.3s;
            border-bottom: 3px solid transparent;
            text-align: center;
        }

        .tab-btn:hover { background-color: rgba(255,255,255,0.1); color: white; }
        .tab-btn.active { color: white; border-bottom: 3px solid var(--accent-color); background-color: rgba(255,255,255,0.05); }

        .tab-content { padding: 20px; display: none; flex-direction: column; flex-grow: 1; }
        .tab-content.active { display: flex; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #34495e; font-size: 14px; }
        input[type="text"], input[type="date"], input[type="number"], input[type="color"], select, textarea {
            width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 4px; font-size: 14px;
        }
        textarea { resize: vertical; }
        
        button.action-btn {
            width: 100%; padding: 12px; background-color: var(--accent-color); color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; transition: 0.2s; margin-bottom: 10px;
        }
        button.action-btn:hover { background-color: #2980b9; }
        button.secondary { background-color: #95a5a6; }
        button.secondary:hover { background-color: #7f8c8d; }
        button.danger { background-color: #e74c3c; }
        button.danger:hover { background-color: #c0392b; }
        button:disabled { background-color: #bdc3c7; cursor: not-allowed; }

        .result-box { background: #f8f9fa; padding: 15px; border-radius: 4px; border-left: 5px solid var(--accent-color); margin: 15px 0; font-size: 18px; font-weight: bold; color: #2c3e50; line-height: 1.5; }

        .history-list { list-style: none; padding: 0; margin: 0; border: 1px solid #eee; border-radius: 4px; max-height: 150px; overflow-y: auto; flex: 1; }
        .history-list li { padding: 8px 10px; border-bottom: 1px solid #eee; font-size: 13px; color: #555; }
        .history-list li:first-child { background-color: #eaf2f8; }

        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; flex: 1; }
        .calc-display { background: #f0f0f0; padding: 15px; text-align: right; font-size: 24px; border-radius: 4px; margin-bottom: 10px; min-height: 60px; display: flex; flex-direction: column; justify-content: center; }
        .calc-expr { font-size: 14px; color: #7f8c8d; height: 20px; }
        .calc-btn { font-size: 20px; border: 1px solid #ddd; background: white; border-radius: 4px; cursor: pointer; }
        .calc-btn:active { background: #eee; }
        .calc-btn.op { background: #ecf0f1; color: var(--primary-color); }
        .calc-btn.eq { background: var(--accent-color); color: white; }

        .memo-area { flex: 1; margin-bottom: 10px; font-family: monospace; line-height: 1.5; }

        .card-detail-text { font-size: 14px; color: #555; margin-top: 10px; line-height: 1.6; background: #fff3cd; padding: 10px; border-radius: 4px; border: 1px solid #ffeeba; white-space: pre-line; }
        .settings-box { background: #fafafa; padding: 15px; border: 1px dashed #ccc; border-radius: 4px; margin-bottom: 15px; }

        .search-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
        .search-btn { padding: 10px; border: none; border-radius: 4px; color: white; font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.2s; text-align: center; }
        .search-btn:hover { opacity: 0.8; }

        .gf-workspace {
            background-color: #ffffff; padding: 20px; border: 2px dashed #cbd5e1; border-radius: 6px; width: 100%; min-height: 350px;
            display: flex; flex-wrap: wrap; align-content: flex-start; transition: gap 0.2s; position: relative;
        }
        .img-card { position: relative; cursor: grab; user-select: none; display: flex; justify-content: center; align-items: center; background: #eee; transition: transform 0.1s; }
        .img-card.dragging { opacity: 0.5; border: 2px dashed var(--primary-color); cursor: grabbing; }
        .img-card img { display: block; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
        .delete-btn { position: absolute; top: 5px; right: 5px; width: 24px; height: 24px; background: rgba(239, 68, 68, 0.9); color: white; border-radius: 50%; text-align: center; line-height: 22px; font-size: 16px; cursor: pointer; z-index: 20; opacity: 0; transition: opacity 0.2s; }
        .img-card:hover .delete-btn { opacity: 1; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <button class="btn-pop" onclick="openPopup()">📌 開啟獨立小視窗</button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('pricing')">📊 商品計價</button>
        <button class="tab-btn" onclick="switchTab('profit')">💰 利潤計算</button>
        <button class="tab-btn" onclick="switchTab('calc')">📟 計算機</button>
        <button class="tab-btn" onclick="switchTab('shop')">🛒 商城外連</button>
        <button class="tab-btn" onclick="switchTab('memo')">📝 記事本</button>
        <button class="tab-btn" onclick="switchTab('gridflow')">🖼️ 圖片合併</button>
        <button class="tab-btn" onclick="switchTab('card')">💳 刷卡判斷</button>
        <button class="tab-btn" onclick="switchTab('link')">🔗 圖片外連</button>
    </div>

    <div id="pricing" class="tab-content active">
        <div class="form-group">
            <label>選擇計價模式：</label>
            <select id="modeSelector" onchange="updatePricingFields()">
                <option value="0">通販計價計算器</option>
                <option value="1">中堅CD計價計算器</option>
                <option value="2">中堅船版書籍計算器</option>
                <option value="3">會場代購計價計算器</option>
            </select>
        </div>
        <div class="form-group"><input type="text" id="jpyInput" placeholder="日幣售價（可輸入算式，如 6820/1.1）" class="price-input"></div>
        <div class="form-group" id="jpShipGroup"><input type="text" id="jpShipInput" placeholder="日本國內運費（日幣）" class="price-input"></div>
        <div class="form-group" id="rateGroup"><input type="text" id="rateInput" placeholder="目前匯率" class="price-input"></div>
        <div class="form-group" id="shipGroup"><input type="text" id="shipInput" placeholder="國際運費（台幣）" class="price-input"></div>
        <button class="action-btn" onclick="calculatePrice()">計算</button>
        <div class="result-box" id="priceResult">建議售價：</div>
        <label>歷史紀錄：</label><ul class="history-list" id="pricingHistory"></ul>
        <div style="margin-top: 10px; display: flex; gap: 10px;">
            <button class="action-btn secondary" onclick="clearPricingInputs()">🧹 清除輸入</button>
            <button class="action-btn danger" onclick="clearHistory()">🗑️ 清空紀錄</button>
        </div>
    </div>

    <div id="profit" class="tab-content">
        <div class="form-group"><label>商品總成本：</label><input type="text" id="profitCost" placeholder="請輸入商品成本（可輸入算式，如 1500+200）" class="profit-input"></div>
        <div class="form-group"><label>商品售價：</label><input type="text" id="profitPrice" placeholder="請輸入商品售價（可輸入算式）" class="profit-input"></div>
        <div style="display: flex; gap: 10px;">
            <div class="form-group" style="flex: 1;"><label>成交費 (%)：</label><input type="number" id="profitFeeRate" value="3" step="0.1" class="profit-input" title="上限以售價 20,000 計算"></div>
            <div class="form-group" style="flex: 1;"><label>金流費 (%)：</label><input type="number" id="profitPaymentFeeRate" value="1.5" step="0.1" class="profit-input" title="無上限"></div>
            <div class="form-group" style="flex: 1;"><label>發票稅 (%)：</label><input type="number" id="profitTaxRate" value="5" step="0.1" class="profit-input" title="台灣標準營業稅為 5%"></div>
        </div>
        <button class="action-btn" onclick="calculateProfit()" style="background-color: #27ae60;">💰 計算利潤</button>
        <div class="result-box" id="profitResult">淨利潤：<br>利潤率：</div>
        <div class="card-detail-text" id="profitDetail">計算明細將顯示於此。</div>
        <div style="margin-top: 10px;"><button class="action-btn secondary" onclick="clearProfitInputs()">🧹 清除輸入</button></div>
    </div>

    <div id="calc" class="tab-content">
        <div class="calc-display">
            <div class="calc-expr" id="calcExpr"></div>
            <div id="calcResult">0</div>
        </div>
        <div class="calc-grid">
            <button class="calc-btn op" onclick="calcInput('AC')">AC</button>
            <button class="calc-btn op" onclick="calcInput('(')">(</button>
            <button class="calc-btn op" onclick="calcInput(')')">)</button>
            <button class="calc-btn op" onclick="calcInput('DEL')">←</button>
            <button class="calc-btn" onclick="calcInput('7')">7</button>
            <button class="calc-btn" onclick="calcInput('8')">8</button>
            <button class="calc-btn" onclick="calcInput('9')">9</button>
            <button class="calc-btn op" onclick="calcInput('÷')">÷</button>
            <button class="calc-btn" onclick="calcInput('4')">4</button>
            <button class="calc-btn" onclick="calcInput('5')">5</button>
            <button class="calc-btn" onclick="calcInput('6')">6</button>
            <button class="calc-btn op" onclick="calcInput('×')">×</button>
            <button class="calc-btn" onclick="calcInput('1')">1</button>
            <button class="calc-btn" onclick="calcInput('2')">2</button>
            <button class="calc-btn" onclick="calcInput('3')">3</button>
            <button class="calc-btn op" onclick="calcInput('-')">-</button>
            <button class="calc-btn" onclick="calcInput('0')">0</button>
            <button class="calc-btn" onclick="calcInput('.')">.</button>
            <button class="calc-btn eq" onclick="calcInput('=')">=</button>
            <button class="calc-btn op" onclick="calcInput('+')">+</button>
        </div>
    </div>

    <div id="shop" class="tab-content">
        <h3 style="margin-top: 0; margin-bottom: 15px; color: #2c3e50; font-size: 16px; border-left: 4px solid var(--accent-color); padding-left: 8px;">📌 商品編號直達</h3>
        <div class="form-group"><label>選擇商城：</label><select id="shopSelector"><option value="melon">🍈 Melonbooks</option><option value="surugaya">📦 駿河屋 (Suruga-ya)</option><option value="booth">🎨 BOOTH</option><option value="yahoo">🔨 日本 Yahoo 拍賣</option><option value="mercari">🛍️ Mercari</option></select></div>
        <div class="form-group"><label>商品編號 (或完整網址)：</label><div style="display: flex; gap: 5px;"><input type="text" id="shopInput" placeholder="輸入編號或直接貼上網址"><button class="action-btn secondary" style="width: 80px; margin:0;" onclick="pasteToShopInput()">貼上</button></div></div>
        <button class="action-btn" onclick="openShop()">🚀 開啟商品頁面</button>
        <hr style="margin: 25px 0; border: 0; border-top: 1px dashed #ccc;">
        <h3 style="margin-top: 0; margin-bottom: 15px; color: #2c3e50; font-size: 16px; border-left: 4px solid #e67e22; padding-left: 8px;">🔍 跨平台關鍵字搜尋</h3>
        <div class="form-group"><label>輸入搜尋關鍵字：</label><div style="display: flex; gap: 5px;"><input type="text" id="searchKeyword" placeholder="例如: 初音未來、Hololive..."><button class="action-btn secondary" style="width: 80px; margin:0;" onclick="document.getElementById('searchKeyword').value=''">清除</button></div></div>
        <div class="search-grid">
            <button class="search-btn" style="background-color: #f39c12;" onclick="doSearch('amazon')">🛒 Amazon JP</button>
            <button class="search-btn" style="background-color: #3498db;" onclick="doSearch('sofmap')">💻 Sofmap</button>
            <button class="search-btn" style="background-color: #2ecc71;" onclick="doSearch('melon')">🍈 Melonbooks</button>
            <button class="search-btn" style="background-color: #d35400;" onclick="doSearch('getchu')">🔞 Getchu</button>
            <button class="search-btn" style="background-color: #bf0000;" onclick="doSearch('rakuten')">📖 楽天ブックス</button>
            <button class="search-btn" style="background-color: #9b59b6;" onclick="doSearch('surugaya')">📦 駿河屋</button>
            <button class="search-btn" style="background-color: #16a085;" onclick="doSearch('trader')">💿 Trader (綜合)</button>
            <button class="search-btn" style="background-color: #004bbb;" onclick="doSearch('animate')">🅰️ アニメイト</button>
            <button class="search-btn" style="background-color: #2980b9;" onclick="doSearch('gamers')">🎮 Gamers</button>
            <button class="search-btn" style="background-color: #e67e22;" onclick="doSearch('amiami')">🌟 Amiami</button>
            <button class="search-btn" style="background-color: #000000;" onclick="doSearch('tora')">🐯 虎之穴</button>
            <button class="search-btn" style="background-color: #34495e;" onclick="doSearch('ebten')">📚 ebten</button>
            <button class="search-btn" style="background-color: #2c3e50;" onclick="doSearch('wondergoo')">💿 WonderGOO</button>
            <button class="search-btn" style="background-color: #e74c3c;" onclick="doSearch('booth')">🎨 BOOTH</button>
            <button class="search-btn" style="background-color: #f1c40f; color: #333;" onclick="doSearch('yahoo')">🔨 日本Yahoo 拍賣</button>
            <button class="search-btn" style="background-color: #e056fd;" onclick="doSearch('mercari')">🛍️ Mercari</button>
            <button class="search-btn" style="background-color: #1abc9c;" onclick="doSearch('neowing')">💿 Neowing</button>
        </div>
    </div>

    <div id="memo" class="tab-content"><textarea class="memo-area" id="memoArea" placeholder="在這裡輸入記事內容... (自動儲存)"></textarea><button class="action-btn danger" onclick="clearMemo()">🧹 清空記事</button></div>

    <div id="gridflow" class="tab-content">
        <div class="form-group"><button class="action-btn" onclick="document.getElementById('fileInput').click()" style="background-color: #10b981; margin-bottom:0;">📷 點擊上傳商品圖片 (可多選)</button><input type="file" id="fileInput" multiple accept="image/*" style="display: none;"></div>
        <div style="display: flex; gap: 10px;"><div class="form-group" style="flex: 1;"><label>排列模式</label><select id="layoutMode"><option value="grid" selected>網格 (Grid)</option><option value="horizontal">橫向 (Horizontal)</option><option value="vertical">縱向 (Vertical)</option></select></div><div class="form-group" id="gridSettings" style="flex: 1;"><label>每列張數</label><input type="number" id="colCount" value="2" min="1" max="10"></div></div>
        <div class="form-group" id="gridInvertSetting" style="background: #f1f5f9; padding: 10px; border-radius: 4px;"><label style="display: flex; align-items: center; gap: 8px; margin: 0; cursor: pointer; font-weight: normal;"><input type="checkbox" id="incompleteTop" style="width: auto;"><span>將未滿的排置頂 (倒金字塔)</span></label></div>
        <div style="display: flex; gap: 10px;"><div class="form-group" style="flex: 1;"><label>間距 (px)</label><input type="number" id="gapSize" value="10" min="0" max="100"></div><div class="form-group" style="flex: 1;"><label>背景顏色</label><input type="color" id="bgColor" value="#ffffff" style="padding: 2px 5px; height: 40px;"></div><div class="form-group" style="flex: 1;"><label>格式</label><select id="exportFormat"><option value="image/jpeg">JPG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select></div></div>
        <div style="display: flex; gap: 10px;"><button id="downloadBtn" class="action-btn" disabled>⬇️ 下載合併圖片</button><button id="clearImgBtn" class="action-btn secondary">🗑️ 清空畫布</button></div>
        <div id="interactive-area" class="gf-workspace"></div><canvas id="renderCanvas" style="display:none;"></canvas>
    </div>

    <div id="card" class="tab-content">
        <div class="settings-box"><label style="margin-bottom: 10px; display: block; font-weight: bold; color: #2c3e50;">⚙️ 信用卡設定 (系統會自動記憶)</label><div style="display: flex; gap: 10px; margin-bottom: 10px;"><div style="flex: 2;"><label>卡片 A 名稱</label><input type="text" id="card1Name" placeholder="例如: 中國信託" value="中國信託" onchange="saveCardSettings(); recommendCard()"></div><div style="flex: 1;"><label>A 出帳日</label><input type="number" id="card1Date" min="1" max="31" placeholder="日" value="5" onchange="saveCardSettings(); recommendCard()"></div></div><div style="display: flex; gap: 10px;"><div style="flex: 2;"><label>卡片 B 名稱</label><input type="text" id="card2Name" placeholder="例如: 華南銀行" value="華南銀行" onchange="saveCardSettings(); recommendCard()"></div><div style="flex: 1;"><label>B 出帳日</label><input type="number" id="card2Date" min="1" max="31" placeholder="日" value="23" onchange="saveCardSettings(); recommendCard()"></div></div></div>
        <div class="form-group"><label>請款時機：</label><select id="chargeType" onchange="toggleDateLabel(); recommendCard()"><option value="immediate">當下立刻請款 (現貨 / 訂購即扣款)</option><option value="release">發售前夕請款 (出貨前才扣款的預購品)</option></select></div>
        <div class="form-group"><label id="dateLabel">選擇刷卡日期 (預設為今天)：</label><input type="date" id="swipeDate" onchange="recommendCard()"></div>
        <button class="action-btn" onclick="recommendCard()">💡 分析最佳刷卡卡片</button>
        <div class="result-box" id="cardResult">建議刷卡：請選擇日期</div><div class="card-detail-text" id="cardDetail">分析結果將顯示在此處。</div>
    </div>

    <div id="link" class="tab-content">
        <div class="form-group"><label>Google 圖片分享連結：</label><div style="display: flex; gap: 5px;"><input type="text" id="linkInput" placeholder="貼上連結..."><button class="action-btn secondary" style="width: 80px; margin:0;" onclick="pasteFromClipboard()">貼上</button></div></div>
        <div style="display: flex; gap: 10px;"><button class="action-btn" onclick="convertLink()">轉換</button><button class="action-btn secondary" id="copyLinkBtn" onclick="copyLink()" disabled>📋 複製</button></div>
        <div class="form-group" style="margin-top: 15px;"><label>轉換結果：</label><textarea id="linkOutput" rows="4" readonly></textarea></div>
        <button class="action-btn secondary" onclick="document.getElementById('linkInput').value=''; document.getElementById('linkOutput').value='';">🧹 清除</button>
    </div>
</div>

<script>
    // 單一完整的 JavaScript 區塊
    document.addEventListener('DOMContentLoaded', () => {
        // 1. 定價初始化
        const rate = localStorage.getItem('tool_last_rate');
        if (rate) document.getElementById('rateInput').value = rate;
        updatePricingFields();
        document.querySelectorAll('.price-input').forEach(input => {
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); calculatePrice(); }
            });
        });

        // 2. 利潤初始化
        document.querySelectorAll('.profit-input').forEach(input => {
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); calculateProfit(); }
            });
        });

        // 3. 計算機鍵盤監聽
        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('calc').classList.contains('active')) return;
            if (/[0-9\.]/.test(e.key)) calcInput(e.key);
            else if (e.key === '+') calcInput('+');
            else if (e.key === '-') calcInput('-');
            else if (e.key === '*') calcInput('×');
            else if (e.key === '/') calcInput('÷');
            else if (e.key === 'Enter') { e.preventDefault(); calcInput('='); }
            else if (e.key === 'Backspace') calcInput('DEL');
            else if (e.key === 'Escape') calcInput('AC');
        });

        // 4. 商城初始化
        const shopInput = document.getElementById('shopInput');
        if (shopInput) shopInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); openShop(); } });
        const searchInput = document.getElementById('searchKeyword');
        if (searchInput) searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') e.preventDefault(); });

        // 5. 記事本初始化
        const memoArea = document.getElementById('memoArea');
        if (localStorage.getItem('tool_memo')) memoArea.value = localStorage.getItem('tool_memo');
        memoArea.addEventListener('input', () => localStorage.setItem('tool_memo', memoArea.value));

        // 6. 拼圖初始化
        initGridFlow();

        // 7. 刷卡初始化
        loadCardSettings(); 
        initCardDate();
    });

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        const index = ['pricing', 'profit', 'calc', 'shop', 'memo', 'gridflow', 'card', 'link'].indexOf(tabId);
        document.querySelectorAll('.tab-btn')[index].classList.add('active');
    }

    // === 定價邏輯 ===
    function evalSafe(e) { try { return eval(e.replace(/×/g,'*').replace(/÷/g,'/')) || 0; } catch(x){return 0;} }
    function updatePricingFields() {
        const mode = parseInt(document.getElementById('modeSelector').value);
        document.getElementById('jpShipGroup').style.display = (mode === 0) ? 'block' : 'none';
        document.getElementById('rateGroup').style.display = (mode !== 1) ? 'block' : 'none';
        document.getElementById('shipGroup').style.display = (mode === 0 || mode === 3) ? 'block' : 'none';
        const rateInput = document.getElementById('rateInput');
        rateInput.placeholder = (mode === 2) ? "請輸入含利潤的匯率/係數 (e.g., 0.23)" : "目前匯率 (e.g., 4.5)";
    }
    function calculatePrice() {
        const m = parseInt(document.getElementById('modeSelector').value);
        const jVal = document.getElementById('jpyInput').value;
        const j = evalSafe(jVal), r = evalSafe(document.getElementById('rateInput').value);
        const s = evalSafe(document.getElementById('shipInput').value), js = evalSafe(document.getElementById('jpShipInput').value);
        let res = 0, rateDisplay = ''; 
        if (m === 0) { localStorage.setItem('tool_last_rate', r); res = ((j + js) * r + s) / 0.8; rateDisplay = `@匯率${r}`; }
        else if (m === 1) { let b = j * 1.05 * 0.27 + 50; if (j >= 4000) b = j * 1.05 * 0.26 + 50; if (j >= 8000) b = j * 1.05 * 0.25 + 50; res = b / 0.95; rateDisplay = `[固定係數]`; }
        else if (m === 2) { localStorage.setItem('tool_last_rate', r); let b = j * 1.05 * r; if (b <= 1000) b += 50; else if (b <= 1999) b += 100; else b += 200; res = b / 0.95; rateDisplay = `@係數${r}`; }
        else if (m === 3) { localStorage.setItem('tool_last_rate', r); res = (j * 1.15 * r + s) / 0.8; rateDisplay = `@匯率${r}`; }
        const final = res.toFixed(2);
        document.getElementById('priceResult').innerText = `建議售價：NT$ ${final}`;
        const modeName = document.getElementById('modeSelector').options[m].text;
        const item = document.createElement('li'); item.innerText = `[${modeName}] 售價：${jVal} ${rateDisplay} → NT$${final}`;
        document.getElementById('pricingHistory').insertBefore(item, document.getElementById('pricingHistory').firstChild);
    }
    function clearPricingInputs() { ['jpyInput','jpShipInput','shipInput'].forEach(id=>document.getElementById(id).value=''); document.getElementById('priceResult').innerText='建議售價：'; }
    function clearHistory() { document.getElementById('pricingHistory').innerHTML = ''; }

    // === 利潤邏輯 ===
    function calculateProfit() {
        const cost = evalSafe(document.getElementById('profitCost').value);
        const price = evalSafe(document.getElementById('profitPrice').value);
        const feeRate = parseFloat(document.getElementById('profitFeeRate').value) / 100 || 0;
        const paymentFeeRate = parseFloat(document.getElementById('profitPaymentFeeRate').value) / 100 || 0;
        const taxRate = parseFloat(document.getElementById('profitTaxRate').value) / 100 || 0;

        if (price <= 0) {
            document.getElementById('profitResult').innerHTML = "淨利潤：0<br>利潤率：0%";
            document.getElementById('profitDetail').innerText = "請輸入有效的售價";
            return;
        }

        const feeBase = Math.min(price, 20000);
        const fee = Math.round(feeBase * feeRate);
        const paymentFee = Math.round(price * paymentFeeRate);
        const tax = Math.round(price * taxRate);
        const profit = price - cost - fee - paymentFee - tax;
        const margin = (profit / price) * 100;

        document.getElementById('profitResult').innerHTML = `淨利潤：NT$ ${profit}<br>利潤率：${margin.toFixed(2)}%`;
        document.getElementById('profitDetail').innerText = `扣除明細：\n成本 = NT$ ${cost}\n成交費 (${(feeRate * 100).toFixed(1)}%, 最高以2萬計) = NT$ ${fee}\n金流費 (${(paymentFeeRate * 100).toFixed(1)}%, 無上限) = NT$ ${paymentFee}\n發票稅 (${(taxRate * 100).toFixed(1)}%) = NT$ ${tax}`;
    }
    function clearProfitInputs() {
        document.getElementById('profitCost').value = ''; document.getElementById('profitPrice').value = '';
        document.getElementById('profitResult').innerHTML = '淨利潤：<br>利潤率：'; document.getElementById('profitDetail').innerText = '計算明細將顯示於此。';
    }

    // === 計算機邏輯 (左至右) ===
    let calcExpr = ""; let calcLastRes = "";
    function calcInput(key) {
        const resDisp = document.getElementById('calcResult'); // 已修正 ID 對齊 HTML
        const exprDisp = document.getElementById('calcExpr');

        if (key === 'AC') {
            calcExpr = ""; calcLastRes = ""; resDisp.innerText = "0"; exprDisp.innerText = "";
        } else if (key === 'DEL') {
            calcExpr = calcExpr.slice(0, -1); resDisp.innerText = calcExpr || "0";
        } else if (key === '=') {
            if (!calcExpr) return;
            try {
                let s = calcExpr.replace(/×/g, '*').replace(/÷/g, '/');
                let tokens = s.match(/(\d+\.?\d*)|([\+\-\*\/])/g);
                if (!tokens) return;
                let result = parseFloat(tokens[0]);
                for (let i = 1; i < tokens.length; i += 2) {
                    let op = tokens[i], val = parseFloat(tokens[i+1]);
                    if (isNaN(val)) break;
                    if (op === '+') result += val; if (op === '-') result -= val;
                    if (op === '*') result *= val; if (op === '/') result /= val;
                }
                calcLastRes = Math.round(result * 100) / 100 + "";
                resDisp.innerText = calcLastRes; exprDisp.innerText = calcExpr + " ="; calcExpr = "";
            } catch (e) { resDisp.innerText = "Error"; calcExpr = ""; }
        } else {
            if (['+','-','×','÷'].includes(key) && !calcExpr && calcLastRes) calcExpr = calcLastRes;
            calcExpr += key; resDisp.innerText = calcExpr;
        }
    }

    // === 記事本邏輯 ===
    function clearMemo() { if(confirm('確定要清空記事嗎？')) { document.getElementById('memoArea').value = ''; localStorage.removeItem('tool_memo'); } }

    // === GridFlow 圖片合併邏輯 ===
    let gfItems = []; let gfDraggedItem = null;
    function initGridFlow() {
        const gfFileInput = document.getElementById('fileInput'), interactArea = document.getElementById('interactive-area');
        if (!gfFileInput) return;
        gfFileInput.addEventListener('change', async (e) => {
            if (!e.target.files.length) return;
            const promises = Array.from(e.target.files).map(f => new Promise((res, rej) => {
                const r = new FileReader(); r.onload = evt => res({ id: Math.random().toString(36).substr(2, 9), src: evt.target.result });
                r.onerror = () => rej('error'); r.readAsDataURL(f);
            }));
            try { gfItems = [...gfItems, ...await Promise.all(promises)]; renderInteractiveArea(); } 
            catch(err) { alert('圖片上傳失敗'); } finally { gfFileInput.value = ''; }
        });
        ['layoutMode', 'colCount', 'incompleteTop', 'gapSize', 'bgColor'].forEach(id => {
            document.getElementById(id).addEventListener('input', updateLayoutVisuals);
            document.getElementById(id).addEventListener('change', updateLayoutVisuals);
        });
        document.getElementById('layoutMode').addEventListener('change', (e) => {
            const isGrid = e.target.value === 'grid';
            document.getElementById('gridSettings').style.display = isGrid ? 'block' : 'none';
            document.getElementById('gridInvertSetting').style.display = isGrid ? 'block' : 'none';
        });
        document.getElementById('clearImgBtn').onclick = () => { gfItems = []; renderInteractiveArea(); };
        document.getElementById('downloadBtn').onclick = generateAndDownload;
        interactArea.addEventListener('dragover', (e) => {
            e.preventDefault(); if (!gfDraggedItem) return;
            const targetCard = e.target.closest('.img-card');
            if (targetCard && targetCard !== gfDraggedItem) {
                const kids = Array.from(interactArea.children);
                if (kids.indexOf(gfDraggedItem) < kids.indexOf(targetCard)) targetCard.after(gfDraggedItem); else targetCard.before(gfDraggedItem);
                setTimeout(updateLayoutVisuals, 0); 
            }
        });
    }
    function renderInteractiveArea() {
        const interactArea = document.getElementById('interactive-area'), dlBtn = document.getElementById('downloadBtn');
        interactArea.innerHTML = '';
        if (gfItems.length === 0) { dlBtn.disabled = true; return; }
        dlBtn.disabled = false;
        gfItems.forEach((item) => {
            const card = document.createElement('div'); card.className = 'img-card'; card.draggable = true; card.dataset.id = item.id;
            const delBtn = document.createElement('div'); delBtn.className = 'delete-btn'; delBtn.innerHTML = '×';
            delBtn.onclick = (e) => { e.stopPropagation(); gfItems = gfItems.filter(i => i.id !== item.id); renderInteractiveArea(); };
            const img = document.createElement('img'); img.src = item.src;
            card.append(img, delBtn);
            card.addEventListener('dragstart', function() { gfDraggedItem = this; setTimeout(() => this.classList.add('dragging'), 0); });
            card.addEventListener('dragend', function() { this.classList.remove('dragging'); gfDraggedItem = null; syncGfItems(); updateLayoutVisuals(); });
            interactArea.appendChild(card);
        });
        updateLayoutVisuals();
    }
    function syncGfItems() { gfItems = Array.from(document.getElementById('interactive-area').querySelectorAll('.img-card')).map(c => gfItems.find(i => i.id === c.dataset.id)).filter(Boolean); }
    function updateLayoutVisuals() {
        const interactArea = document.getElementById('interactive-area');
        const mode = document.getElementById('layoutMode').value, gap = parseInt(document.getElementById('gapSize').value) || 0, bg = document.getElementById('bgColor').value, cols = parseInt(document.getElementById('colCount').value) || 2, isInvert = document.getElementById('incompleteTop').checked;
        interactArea.style.backgroundColor = bg; interactArea.style.gap = gap + 'px';
        const cards = interactArea.querySelectorAll('.img-card');
        cards.forEach(c => { c.style.width = ''; c.style.height = ''; c.style.margin = ''; c.style.flexShrink = ''; });
        if (mode === 'horizontal') {
            interactArea.style.flexDirection = 'row'; interactArea.style.justifyContent = 'flex-start'; interactArea.style.flexWrap = 'nowrap'; interactArea.style.overflowX = 'auto';
            cards.forEach(c => { c.style.height = '200px'; c.style.width = 'auto'; c.style.flexShrink = '0'; });
        } else if (mode === 'vertical') {
            interactArea.style.flexDirection = 'column'; interactArea.style.alignItems = 'center'; interactArea.style.flexWrap = 'nowrap';
            cards.forEach(c => { c.style.width = '300px'; c.style.height = 'auto'; });
        } else {
            interactArea.style.flexDirection = 'row'; interactArea.style.flexWrap = 'wrap'; interactArea.style.justifyContent = 'center'; interactArea.style.overflowX = 'hidden';
            const wCalc = `calc((100% - ${gap * (cols - 1)}px) / ${cols})`, rem = cards.length % cols;
            cards.forEach((c, i) => {
                c.style.width = wCalc; c.style.height = 'auto';
                if (isInvert && rem > 0) {
                    if (i === 0) c.style.marginLeft = `calc(${cols - rem} * ((100% + ${gap}px) / ${cols}) / 2)`;
                    if (i === rem - 1) c.style.marginRight = `calc(${cols - rem} * ((100% + ${gap}px) / ${cols}) / 2)`;
                }
            });
        }
    }
    function generateAndDownload() {
        if (!gfItems.length) return;
        Promise.all(gfItems.map(it => new Promise(res => { const img = new Image(); img.onload = () => res(img); img.src = it.src; }))).then(imgs => {
            const mode = document.getElementById('layoutMode').value, gap = parseInt(document.getElementById('gapSize').value) || 0, bg = document.getElementById('bgColor').value, cols = parseInt(document.getElementById('colCount').value), isInvert = document.getElementById('incompleteTop').checked, format = document.getElementById('exportFormat').value;
            const canvas = document.getElementById('renderCanvas'), ctx = canvas.getContext('2d');
            let data = [], cW = 0, cH = 0;
            if (mode === 'grid') {
                const colW = Math.max(...imgs.map(i => i.naturalWidth)); cW = (colW * cols) + (gap * (cols + 1));
                let cY = gap, cIdx = 0, rem = imgs.length % cols;
                while(cIdx < imgs.length) {
                    let count = (cIdx === 0 && isInvert && rem > 0) ? rem : cols;
                    const row = imgs.slice(cIdx, cIdx + count), offset = (cols - row.length) * (colW + gap) / 2;
                    const dims = row.map(img => ({ w: colW, h: img.naturalHeight * (colW / img.naturalWidth), img }));
                    const maxH = Math.max(...dims.map(d => d.h));
                    dims.forEach((d, i) => data.push({ ...d, x: gap + (i * (colW + gap)) + offset, y: cY }));
                    cY += maxH + gap; cIdx += count;
                }
                cH = cY;
            } else if (mode === 'horizontal') {
                const maxH = Math.max(...imgs.map(i => i.naturalHeight)); let cX = gap;
                imgs.forEach(img => { const scale = maxH / img.naturalHeight; data.push({ img, x: cX, y: gap, w: img.naturalWidth * scale, h: maxH }); cX += (img.naturalWidth * scale) + gap; });
                cH = maxH + gap * 2; cW = cX;
            } else {
                const maxW = Math.max(...imgs.map(i => i.naturalWidth)); let cY = gap;
                imgs.forEach(img => { const scale = maxW / img.naturalWidth; data.push({ img, x: gap, y: cY, w: maxW, h: img.naturalHeight * scale }); cY += (img.naturalHeight * scale) + gap; });
                cW = maxW + gap * 2; cH = cY;
            }
            canvas.width = cW; canvas.height = cH; ctx.fillStyle = bg; ctx.fillRect(0, 0, cW, cH);
            ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
            data.forEach(d => ctx.drawImage(d.img, d.x, d.y, d.w, d.h));
            const link = document.createElement('a'); link.download = `Merged_Image_${Date.now()}.${format.split('/')[1]}`; link.href = canvas.toDataURL(format, 0.95); link.click();
        });
    }

    function recommendCard() {
        const dStr = document.getElementById('swipeDate').value; if (!dStr) return;
        let t = new Date(dStr), p = "";
        if (document.getElementById('chargeType').value === 'release') { t.setDate(t.getDate() - 3); p = `⚠️ 此為預購品，系統已將發售日提前 3 天。\n🗓️ 預估實際請款日為：${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}\n--------------------------\n`; }
        const c1n = document.getElementById('card1Name').value, c1d = parseInt(document.getElementById('card1Date').value) || 1;
        const c2n = document.getElementById('card2Name').value, c2d = parseInt(document.getElementById('card2Date').value) || 1;
        const gN = (c, b) => { let n = new Date(c.getFullYear(), c.getMonth(), b); if(c.getDate() >= b) n.setMonth(n.getMonth()+1); return n; };
        const gD = (c, t) => Math.ceil((t - c) / 86400000);
        const d1 = gD(t, gN(t, c1d)), d2 = gD(t, gN(t, c2d));
        let b="", c="#27ae60", r="";
        if (d1 > d2) { b=c1n; c="#2980b9"; r=`• 【${c1n}】約剩 ${d1} 天出帳。\n• 【${c2n}】約剩 ${d2} 天出帳。\n\n👉 結論：請用【${c1n}】結帳！`; }
        else if (d2 > d1) { b=c2n; c="#e67e22"; r=`• 【${c1n}】約剩 ${d1} 天出帳。\n• 【${c2n}】約剩 ${d2} 天出帳。\n\n👉 結論：請用【${c2n}】結帳！`; }
        else { b="兩張皆可"; c="#8e44ad"; r=`• 兩張卡的預計出帳天數相同 (皆剩約 ${d1} 天)。\n\n👉 結論：刷哪一張都可以！`; }
        document.getElementById('cardResult').innerHTML = `最佳推薦：<span style="color: ${c};">${b}</span>`; document.getElementById('cardDetail').innerText = p + r;
    }
